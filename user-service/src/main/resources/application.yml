server:
  port: 8083

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/Decision_IS
    username: postgres
    password: 54321
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: user-service
        register: true
        prefer-ip-address: true
        ip-address: host.docker.internal
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${server.port}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET:YTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6TUI0NTY3ODkwYmNkZWZnaGlqa2xtbm9wY3JzdHV2dw==}
  expiration: 28800000

app:
  security:
    cors:
      allowed-origins: "http://localhost:5500,http://127.0.0.1:5500"