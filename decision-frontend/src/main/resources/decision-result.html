<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision System — Результати</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  
  <script>
    document.documentElement.setAttribute(
      'data-theme',
      localStorage.getItem('dss-theme') || 'light'
    );
  </script>

  <link rel="stylesheet" href="theme.css" />

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="global.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
    

    .main {
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .left-col { display: flex; flex-direction: column; gap: 16px; }
    .right-col { display: flex; flex-direction: column; gap: 16px; }

    /* Вікна */
    .window { border: 2.5px solid; overflow: hidden; }
    .window-results      { border-color: var(--window-results-border); }
    .window-reco         { border-color: var(--window-reco-border); }
    .window-chart-radar  { border-color: var(--window-chart-radar-border); }
    .window-chart-hbar   { border-color: var(--window-chart-hbar-border); }
    .window-chart-grouped{ border-color: var(--window-chart-grouped-border); }

    .window-titlebar {
      padding: 10px 16px; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
    }

    .window-results .window-titlebar {
      background: var(--window-left-header); color: var(--window-left-text);
      border-bottom: 2px solid var(--border-blue);
    }
    .window-reco .window-titlebar {
      background: var(--window-reco-bg); color: var(--window-reco-text);
      border-bottom: 2px solid var(--window-reco-border);
    }

    /* Графіки — окремі змінні бо їх 3 */
    .window-chart-radar .window-titlebar  {
      background: var(--window-chart-radar-bg); color: var(--window-chart-radar-text);
      border-bottom: 2px solid var(--window-chart-radar-border);
    }
    .window-chart-hbar .window-titlebar   {
      background: var(--window-chart-hbar-bg); color: var(--window-chart-hbar-text);
      border-bottom: 2px solid var(--window-chart-hbar-border);
    }
    .window-chart-grouped .window-titlebar{
      background: var(--window-chart-grouped-bg); color: var(--window-chart-grouped-text);
      border-bottom: 2px solid var(--window-chart-grouped-border);
    }

    .window-reco .window-body {
      height: 240px; overflow-y: auto; padding: 16px;
      background: var(--bg-primary);
      font-size: 14px; color: var(--text-primary); line-height: 1.8;
    }
    .chart-body { padding: 16px; background: var(--bg-primary); }

    /* Рядки результатів */
    .alt-row {
      padding: 11px 16px; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .alt-row:last-child { border-bottom: none; }
    .alt-row.above { background: var(--s-done-bg);   color: var(--s-done-color); }
    .alt-row.below { background: var(--s-failed-bg); color: var(--s-failed-color); }
    .alt-rank  { font-size: 12px; opacity: 0.7; margin-right: 8px; }
    .alt-score { font-size: 13px; font-weight: 600; }

    .recommended {
      padding: 10px 16px; background: var(--window-left-body);
      border-top: 2px solid var(--border-blue);
      font-size: 13px; color: var(--window-left-text);
      display: flex; align-items: center; gap: 8px;
    }

    /* Кнопка звіту */
    .btn-report {
      background: var(--bg-tertiary); border: 2px solid var(--border-primary);
      padding: 13px 28px; font-size: 15px; font-weight: 500;
      color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; gap: 8px; width: fit-content;
    }
    .btn-report:hover { background: var(--bg-secondary); }
  </style>
</head>
<body>

  <nav class="navbar">
    <span class="navbar-logo" data-language="nav.logo">Decision Support System</span>
    <div class="navbar-right">
      <span class="user-label" id="user-box"></span>
      <button class="btn-theme" id="btn-theme" onclick="toggleTheme()" title="Toggle theme">
        <i class="ti ti-moon" aria-hidden="true"></i>
      </button>
      <button class="btn-lang" id="btn-lang" onclick="toggleLang()">EN</button>
      <button class="btn-logout" onclick="logout()" data-language="nav.logout">Вийти</button>
    </div>
  </nav>

  <main class="main">
    <div class="left-col">

      <!-- Результати -->
      <div class="window window-results">
        <div class="window-titlebar" style="justify-content:space-between;">
          <span style="display:flex;align-items:center;gap:8px;">
            <i class="ti ti-chart-bar" style="font-size:15px" aria-hidden="true"></i>
            <span data-language="results.title">Результати</span>
          </span>
          <span id="calculated-at-label" style="font-size:11px;font-weight:400;opacity:0.7;display:none;align-items:center;gap:4px;">
            <i class="ti ti-calculator" style="font-size:11px" aria-hidden="true"></i>
            <span id="calculated-at-text"></span>
          </span>
        </div>
        <div id="results-list"></div>
        <div class="recommended" id="recommended-block" style="display:none;">
          <i class="ti ti-circle-check" style="font-size:15px" aria-hidden="true"></i>
          <span data-language="results.recommended">Рекомендована альтернатива</span>:
          <strong id="recommended-name"></strong>
        </div>
      </div>

      <!-- Кнопка PDF -->
      <button class="btn-report" id="pdf-btn" onclick="handlePDF()">
        <i class="ti ti-file-type-pdf" style="font-size:18px" aria-hidden="true"></i>
        <span id="pdf-btn-label">...</span>
      </button>

      <!-- Radar -->
      <div class="window window-chart-radar">
        <div class="window-titlebar">
          <i class="ti ti-chart-radar" style="font-size:15px" aria-hidden="true"></i>
          <span data-language="results.chart_radar">Порівняння по факторах (Radar)</span>
        </div>
        <div class="chart-body">
          <canvas id="radarChart"></canvas>
        </div>
      </div>

    </div>

    <div class="right-col">

      <!-- Рекомендації -->
      <div class="window window-reco">
        <div class="window-titlebar">
          <i class="ti ti-bulb" style="font-size:15px" aria-hidden="true"></i>
          <span data-language="results.reco_section">Рекомендації</span>
        </div>
        <div class="window-body" id="reco-text"></div>
      </div>

      <!-- Horizontal bar -->
      <div class="window window-chart-hbar">
        <div class="window-titlebar">
          <i class="ti ti-chart-bar" style="font-size:15px" aria-hidden="true"></i>
          <span data-language="results.chart_hbar">Загальний рейтинг (Horizontal Bar)</span>
        </div>
        <div class="chart-body">
          <canvas id="hbarChart"></canvas>
        </div>
      </div>

      <!-- Grouped bar -->
      <div class="window window-chart-grouped">
        <div class="window-titlebar">
          <i class="ti ti-chart-dots" style="font-size:15px" aria-hidden="true"></i>
          <span data-language="results.chart_grouped">По факторах (Grouped Bar)</span>
        </div>
        <div class="chart-body">
          <canvas id="groupedChart"></canvas>
        </div>
      </div>

    </div>
  </main>

  <script>
  const params = new URLSearchParams(window.location.search);
  const ROLE = params.get('role') || 'ADMIN';
  const decisionId = params.get('id');

 function initializeResultsPage() {
    if (window._resultsPageInit) return;
    window._resultsPageInit = true;

    const user = getUserFromToken();
    if (user) {
        const usernameEl = document.getElementById('username');
        if (usernameEl) usernameEl.textContent = user.login;
    } else {
        window.location.href = 'main-page.html';
        return;
    }

    loadResults();
  }

  if (window.isDssLangReady) {
    initializeResultsPage();
  } else {
    document.addEventListener('langChanged', initializeResultsPage);
  }
  


  // ─── СТАН ────────────────────────────────────────────────────────
  let _results = null;
  let _factors = null;

  // ─── КОЛЬОРИ ГРАФІКІВ ────────────────────────────────────────────
  function getChartColors() {
    const dark  = document.documentElement.getAttribute('data-theme') === 'dark';
    const alpha = dark ? 0.5 : 0.35;
    return {
        bg: [
            `rgba(58,106,154,${alpha})`,
            `rgba(90,154,90,${alpha})`,
            `rgba(154,90,90,${alpha})`,
            `rgba(154,130,58,${alpha})`,
            `rgba(100,80,154,${alpha})`,
        ],
        border: [
            'rgba(58,106,154,1)',
            'rgba(90,154,90,1)',
            'rgba(154,90,90,1)',
            'rgba(154,130,58,1)',
            'rgba(100,80,154,1)',
        ],
        grid:   dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)',
        ticks:  dark ? 'rgba(255,255,255,0.4)'  : 'rgba(0,0,0,0.4)',
        labels: dark ? '#b0bac4' : '#333',
        axis:   dark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)',
    };
  }

  // ─── ГРАФІКИ ─────────────────────────────────────────────────────
  let chartInstances = {};

  function destroyCharts() {
    Object.values(chartInstances).forEach(c => c.destroy());
    chartInstances = {};
  }

  function calculateScaleLimits(values, marginPercent = 0.1) {
    if (!values || values.length === 0) return { min: 0, max: 100 };
    
    const minVal = Math.min(...values);
    const maxVal = Math.max(...values);
    const delta = maxVal - minVal;

    // Якщо всі значення однакові, робимо штучний відступ навколо цього значення
    if (delta === 0) {
        return {
            min: Math.max(0, minVal - (minVal * marginPercent || 1)),
            max: maxVal + (maxVal * marginPercent || 1)
        };
    }

    const padding = delta * marginPercent;
    
    return {
        min: Math.max(0, minVal - padding),
        max: maxVal + padding
    };
  }

  function buildCharts(results, factors) {
    destroyCharts();
    const c         = getChartColors();
    const gridStyle = { color: c.grid, lineWidth: 1 };

    const allFactorScores = results.flatMap(r => factors.map(f => parseFloat(r.factorScores[f] ?? 0)));
    const allTotalScores = results.map(r => r.score);

    const factorScale = calculateScaleLimits(allFactorScores, 0.1);
    const totalScale = calculateScaleLimits(allTotalScores, 0.15); // Для загального рейтингу беремо трохи більший запас

    chartInstances.radar = new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels:   factors,
            datasets: results.map((r, i) => ({
                label:            r.name,
                data:             factors.map(f => parseFloat(r.factorScores[f] ?? 0)),
                backgroundColor:  c.bg[i % c.bg.length],
                borderColor:      c.border[i % c.border.length],
                borderWidth:      1.5,
                pointBackgroundColor: c.border[i % c.border.length],
                pointRadius:      3,
            }))
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, color: c.labels } } },
            scales: {
                r: {
                    min: factorScale.min,
                    max: factorScale.max,
                    ticks: { font: { size: 10 }, color: c.ticks, backdropColor: 'transparent' },
                    pointLabels: { font: { size: 11 }, color: c.labels },
                    grid:        { color: c.grid },
                    angleLines:  { color: c.grid },
                }
            }
        }
    });

    chartInstances.hbar = new Chart(document.getElementById('hbarChart'), {
        type: 'bar',
        data: {
            labels:   results.map(r => r.name),
            datasets: [{
                label:           'Risk Adjusted Score',
                data:            results.map(r => r.score),
                backgroundColor: results.map((_, i) => c.bg[i % c.bg.length]),
                borderColor:     results.map((_, i) => c.border[i % c.border.length]),
                borderWidth:     1.5,
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            plugins: {
                legend:  { display: false },
                tooltip: { callbacks: { label: ctx => ` Score: ${ctx.raw.toFixed(2)}` } }
            },
            scales: {
                x: { 
                    min: totalScale.min, 
                    max: totalScale.max, 
                    ticks: { font: { size: 11 }, color: c.labels }, 
                    grid: gridStyle, 
                    border: { color: c.axis } 
                },
                y: { grid: { display: false }, ticks: { font: { size: 12 }, color: c.labels }, border: { color: c.axis } }
            }
        }
    });

    chartInstances.grouped = new Chart(document.getElementById('groupedChart'), {
        type: 'bar',
        data: {
            labels:   factors,
            datasets: results.map((r, i) => ({
                label:           r.name,
                data:            factors.map(f => parseFloat(r.factorScores[f] ?? 0)),
                backgroundColor: c.bg[i % c.bg.length],
                borderColor:     c.border[i % c.border.length],
                borderWidth:     1.5,
            }))
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, color: c.labels } } },
            scales: {
                x: { grid: { display: false }, ticks: { font: { size: 11 }, color: c.labels }, border: { color: c.axis } },
                y: { 
                    min: factorScale.min, 
                    max: factorScale.max, 
                    ticks: { font: { size: 11 }, color: c.labels }, 
                    grid: gridStyle, 
                    border: { color: c.axis } 
                }
            }
        }
    });
  }

  // ─── NAVBAR ──────────────────────────────────────────────────────
  function setupNavbar() {
    const el   = document.getElementById('user-box');
    const user = getUserFromToken();
    if (!el || !user) return;
    const roleKey = ROLE === 'ADMIN' ? 'nav.role_admin' : 'nav.role_pm';
    el.innerHTML  = `${t(roleKey)}: <strong>${user.login}</strong>`;
  }

  // ─── ДАТА РОЗРАХУНКУ ─────────────────────────────────────────────
  function renderCalculatedAt(isoDate) {
    if (!isoDate) return;
    const d         = new Date(isoDate);
    const formatted = d.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric' })
                    + ' ' + d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    const label = document.getElementById('calculated-at-label');
    document.getElementById('calculated-at-text').textContent =
        `${t('results.calculated_at') || 'Розраховано'}: ${formatted}`;
    label.style.display = 'flex';
  }

  // ─── PDF ─────────────────────────────────────────────────────────
  function setupPDFButton() {
    document.getElementById('pdf-btn-label').textContent =
        ROLE === 'ADMIN'
            ? (t('results.btn_generate') || 'Згенерувати звіт')
            : (t('results.btn_download') || 'Завантажити звіт');
  }

  async function handlePDF() {
    const isUk = (localStorage.getItem('dss-lang') || 'uk') === 'uk';
    const btn  = document.getElementById('pdf-btn');
    btn.disabled = true;

    try {
        if (ROLE === 'ADMIN') {
            await decisionApi.post(
                `/api/decisions/${decisionId}/report`,
                null,
                { params: { isUk } }
            );
            alert(t('results.report_generated') || 'Звіт успішно згенеровано');
        } else {
            const response = await decisionApi.get(
                `/api/decisions/${decisionId}/report/download`,
                { responseType: 'blob' }
            );
            const url  = URL.createObjectURL(response.data);
            const link = document.createElement('a');
            link.href     = url;
            link.download = `decision_report_${decisionId}.pdf`;
            link.click();
            URL.revokeObjectURL(url);
        }
    } catch (err) {
        const status = err.response?.status;
        if (status === 404) {
            alert(t('results.report_not_ready') || 'Звіт ще не згенеровано адміністратором');
        } else {
            alert(t('results.report_error') || 'Помилка при роботі зі звітом');
        }
    } finally {
        btn.disabled = false;
    }
  }

  // ─── РЕЗУЛЬТАТИ ──────────────────────────────────────────────────
  function renderResults(results) {
    const list = document.getElementById('results-list');

    list.innerHTML = results.map(r => `
        <div class="alt-row ${r.isRecommended ? 'above' : 'below'}">
            <span><span class="alt-rank">${r.rank}.</span> ${r.name}</span>
            <span class="alt-score">${r.score.toFixed(2)}</span>
        </div>`).join('');

    const recommended = results.find(r => r.isRecommended);
    const recoBlock   = document.getElementById('recommended-block');

    if (recommended) {
        recoBlock.style.display = 'flex';
        document.getElementById('recommended-name').textContent = recommended.name;
    } else {
        recoBlock.style.display = 'none';
    }

    document.getElementById('reco-text').innerHTML = results.map(r => {
        let template = r.rank === 1
            ? t('results.reco_best')
            : r.isRecommended
                ? t('results.reco_good')
                : t('results.reco_bad');

        return (template || '')
            .replace('{name}',  r.name)
            .replace('{score}', r.score.toFixed(2));
    }).join('<br/>');
  }

  // ─── ЗАВАНТАЖЕННЯ З БЕКУ ─────────────────────────────────────────
  async function loadResults() {
    if (!decisionId) {
        alert('ID рішення не вказано');
        window.location.href = ROLE === 'ADMIN' ? 'admin-dashboard.html' : 'investor-dashboard.html';
        return;
    }

    const isUk = (localStorage.getItem('dss-lang') || 'uk') === 'uk';

    try {
        const response = await decisionApi.get(
            `/api/decisions/${decisionId}/calculation/result`,
            { params: { isUk } }
        );

        const data = response.data;

        _results = data.alternatives.map((alt, i) => ({
            rank:          i + 1,
            name:          alt.name,
            score:         parseFloat(alt.riskAdjustedScore),
            weightedScore: parseFloat(alt.weightedScore),
            riskLevel:     alt.riskLevel,
            isRecommended: alt.isRecommended,
            factorScores:  alt.factorScores || {}
        }));

        _results.sort((a, b) => b.score - a.score);
        _results.forEach((r, i) => r.rank = i + 1);

        _factors = Object.keys(_results[0]?.factorScores || {});

        renderCalculatedAt(data.calculatedAt);
        renderResults(_results);
        setupNavbar();
        setupPDFButton();
        buildCharts(_results, _factors);

    } catch (err) {
        console.error('Помилка завантаження результатів:', err);
        const status = err.response?.status;
        if (status === 401 || status === 403) {
            window.location.href = 'main-page.html';
        } else if (status === 404) {
            alert('Результати не знайдено');
            window.location.href = ROLE === 'ADMIN' ? 'admin-dashboard.html' : 'investor-dashboard.html';
        } else {
            alert('Помилка завантаження результатів');
        }
    }
  }

  // ─── ЛОГАУТ ──────────────────────────────────────────────────────
  function logout() {
    localStorage.removeItem('dss-token');
    window.location.href = 'main-page.html';
  }

  // ─── ІНІЦІАЛІЗАЦІЯ ───────────────────────────────────────────────
  document.addEventListener('langChanged', () => {
    if (!window._resultsPageInit) {
        window._resultsPageInit = true;

        const user = getUserFromToken();
        if (!user) {
            window.location.href = 'main-page.html';
            return;
        }

        loadResults();
    } else {
        loadResults();
    }
  });

  const _origToggle = window.toggleTheme;
  window.toggleTheme = function() {
    _origToggle();
    if (_results && _factors) {
        buildCharts(_results, _factors);
    }
  };
  </script>

</body>
</html>
