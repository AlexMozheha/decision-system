<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision System — Нове рішення</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

  <script>
    document.documentElement.setAttribute(
      'data-theme',
      localStorage.getItem('dss-theme') || 'light'
    );
  </script>

  <link rel="stylesheet" href="theme.css" />
  <script src="global.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }

    .main {
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      align-items: stretch; 
      height: calc(100vh - 80px);
      overflow: hidden;
    }

    .left-col, 
    .right-col { 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
      height: 100%;
      overflow: hidden;
    }

    .name-input {
      width: 100%;
      background: var(--input-bg);
      border: 2px solid var(--border-blue);
      padding: 13px 18px;
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
    }
    .name-input:focus { border-color: var(--border-blue); }
    .name-input::placeholder { color:  var(--text-muted); }

    .window { border: 2.5px solid; overflow: hidden; height: 100%; display: flex; 
      flex-direction: column;}
    .window-left  { border-color: var(--border-blue); }
    .window-right { border-color: var(--border-green); }

    .window-titlebar {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .window-left  .window-titlebar { background: var(--window-left-header); 
      color: var(--window-left-text); border-bottom: 2px solid var(--border-blue) }
    .window-right .window-titlebar { background: var(--window-right-header); 
    color: var(--window-right-text); 
      border-bottom: 2px solid var(--border-green); }

    .window-body { flex-grow: 1; overflow-y: auto; padding: 14px; scrollbar-color: 
      var(--text-faint) var(--bg-primary);}
    .window-left  .window-body { background: var(--window-left-body); }
    .window-right .window-body { background: var(--window-right-body); }

    .alt-item {
      background: var(--bg-primary);
      border: 1.5px solid var(--border-blue);
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .alt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .alt-label { font-size: 12px; color: var(--text-secondary); }
    .btn-remove {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px 4px;
      line-height: 1;
    }
    .btn-remove:hover { background: var(--s-failed-bg); color: var(--s-failed-color); }

    .alt-fields { display: flex; align-items: center; gap: 10px; }
    .alt-name-input {
      flex: 1;
      border: 1.5px solid var(--border-input);
      padding: 7px 10px;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--input-bg);
      outline: none;
    }
    .alt-name-input:focus { border-color: var(--border-blue); }

    .risk-label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
    .risk-input {
      width: 64px;
      border: 1.5px solid var(--border-input);
      padding: 7px 8px;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--input-bg);
      outline: none;
      text-align: center;
    }
    .risk-input:focus { border-color: var(--border-blue);}

    .btn-add {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      border: 1.5px dashed var(--border-primary);
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      transition: all 0.15s ease;
    }
    .btn-add:hover { background: var(--bg-secondary); }

    .comments-textarea {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      font-size: 14px;
      color: var(--text-primary);
      background: transparent;
      resize: none;
      font-family: inherit;
      line-height: 1.7;
    }
    .comments-textarea::placeholder { color: var(--text-muted); }

    .btn-submit {
      width: 100%;
      background: var(--bg-tertiary);
      border: 2px solid var(--border-green);
      padding: 13px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
    }
    
    .btn-submit:hover { background: var(--bg-secondary); }
  </style>
</head>
<body>

  <nav class="navbar">
    <!-- TODO: підставити ім'я з JWT -->
     <span class="navbar-logo" data-language="nav.logo">Decision System</span>
    <div class="navbar-right">
      <span class="user-label">
      <span  data-language="nav.role_pm">Інвестор:</span>
       <strong id="username">User123</strong></span>
      <button class="btn-theme" id="btn-theme" onclick="toggleTheme()" title="Toggle theme">
        <i class="ti ti-moon" aria-hidden="true"></i>
      </button>
      <button class="btn-lang" id="btn-lang" onclick="toggleLang()">EN</button>
      <button class="btn-logout" onclick="logout()" data-language="nav.logout">Вийти</button>
    </div>
  </nav>

  <main class="main">
    <div class="left-col">
      <!-- TODO: значення відправляється на POST /api/decisions -->
      <input class="name-input" id="decision-name" type="text" placeholder="Назва нового рішення" 
      data-language="create_decision.name_placeholder" data-language-attr="placeholder"/>

      <div class="window window-left">
        <div class="window-titlebar">
          <i class="ti ti-list" style="font-size:15px" aria-hidden="true"></i>
          <span data-language="create_decision.window_alts">Альтернативи</span>
        </div>
        <div class="window-body">
          <div id="alt-list"></div>
          <button class="btn-add" onclick="addAlt()">
            <i class="ti ti-plus" style="font-size:15px" aria-hidden="true"></i>
            <span id="btn-add-label" data-language="create_decision.add_alt">Додати альтернативу</span>
          </button>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="window window-right">
        <div class="window-titlebar">
          <i class="ti ti-message" style="font-size:15px" aria-hidden="true"></i>
          <span data-language="create_decision.window_comments">Коментарі</span>
        </div>
        <div class="window-body">
          <textarea class="comments-textarea" id="comments" placeholder="Введіть коментар..."
          data-language="create_decision.enter_comment" data-language-attr="placeholder"></textarea>
        </div>
      </div>
      <!-- TODO: POST /api/decisions зі статусом DRAFT -->
      <button class="btn-submit" onclick="saveDraft()" data-language="create_decision.save_draft"> 
        Зберегти як чернетку</button>
    </div>
  </main>

  <script>
    let counter = 0;

    function createAltItem(id) {
      const riskLabel = t('create_decision.risk_label') || 'Ризик';
      const altLabel  = `${t('create_decision.window_alts') || 'Альтернатива'} ${id}`;
      const placeholder = t('create_decision.name_placeholder') || 'Назва альтернативи';

      const div = document.createElement('div');
      div.className = 'alt-item';
      div.setAttribute('data-id', id);
      div.innerHTML = `
        <div class="alt-header">
          <span class="alt-label">${altLabel}</span>
          <button class="btn-remove" onclick="removeAlt(${id})" title="Видалити">
            <i class="ti ti-x" style="font-size:14px" aria-hidden="true"></i>
          </button>
        </div>
        <div class="alt-fields">
          <input class="alt-name-input" type="text" placeholder="${placeholder}" />
          <span class="risk-label">${riskLabel}:</span>
          <input class="risk-input" type="number" min="1" max="100" placeholder="1–100" />
        </div>`;
      return div;
    }

    function addAlt() {
      counter++;
      const list = document.getElementById('alt-list');
      list.appendChild(createAltItem(counter));
      list.parentElement.scrollTop = list.parentElement.scrollHeight;
    }

    function removeAlt(id) {
      const el = document.querySelector('[data-id="' + id + '"]');
      if (el) el.remove();
    }

    function saveDraft() {
      const name = document.getElementById('decision-name').value.trim();
      const comments = document.getElementById('comments').value.trim();

      const alternatives = Array.from(document.querySelectorAll('.alt-item')).map(item => ({
        name: item.querySelector('.alt-name-input').value.trim(),
        risk: parseInt(item.querySelector('.risk-input').value) || null
      }));

      // TODO: надіслати на бек
      // const token = localStorage.getItem('token');
      // fetch('/api/decisions', {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      //   body: JSON.stringify({ name, comments, alternatives, status: 'DRAFT' })
      // }).then(() => window.location.href = 'investor-dashboard.html');

      console.log({ name, comments, alternatives, status: 'DRAFT' });
    }

    function logout() {
      // TODO: localStorage.removeItem('token');
      window.location.href = 'index.html';
    }

    document.addEventListener('langChanged', () => {
    if (counter === 0) { addAlt(); addAlt(); }}, { once: true });

    document.addEventListener('langChanged', () => {
      const items = document.querySelectorAll('.alt-item');
      items.forEach(item => {
      const id = item.getAttribute('data-id');
      const nameVal = item.querySelector('.alt-name-input').value;
      const riskVal = item.querySelector('.risk-input').value;
      const newItem = createAltItem(id);
      newItem.querySelector('.alt-name-input').value = nameVal;
      newItem.querySelector('.risk-input').value     = riskVal;
      item.replaceWith(newItem);});});

  </script>

</body>
</html>
